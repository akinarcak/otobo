---
Debugger:
  DebugThreshold: error
  TestMode: '0'
Description: CareOnCloud private Elasticsearch integration
FrameworkVersion: 11.1.x
Provider:
  Transport:
    Type: ''
RemoteSystem: Elasticsearch
Requester:
  Invoker:
    CustomerCompanyManagement:
      Description: ''
      Events:
        - Asynchronous: '0'
          Event: CustomerCompanyAdd
        - Asynchronous: '0'
          Event: CustomerCompanyUpdate
      Type: Elasticsearch::CustomerCompanyManagement
    CustomerUserManagement:
      Description: ''
      Events:
        - Asynchronous: '0'
          Event: CustomerUserAdd
        - Asynchronous: '0'
          Event: CustomerUserUpdate
      Type: Elasticsearch::CustomerUserManagement
    Search:
      Description: ''
      Type: Elasticsearch::Search
    TicketIngestAttachment:
      Description: ''
      Type: Elasticsearch::TicketManagement
    TicketManagement:
      Description: ''
      Events:
        - Asynchronous: '0'
          Event: TicketCreate
        - Asynchronous: '0'
          Event: ArticleCreate
        - Asynchronous: '0'
          Event: TicketCustomerUpdate
        - Asynchronous: '0'
          Event: TicketQueueUpdate
        - Asynchronous: '0'
          Event: TicketTitleUpdate
        - Asynchronous: '0'
          Event: QueueUpdate
        - Asynchronous: '0'
          Event: TicketDelete
        - Asynchronous: '0'
          Event: TicketArchiveFlagUpdate
      Type: Elasticsearch::TicketManagement
    UtilsIngest_DELETE:
      Description: ''
      Type: Elasticsearch::Utils
    UtilsIngest_GET:
      Description: ''
      Type: Elasticsearch::Utils
    UtilsPipeline_DELETE:
      Description: ''
      Type: Elasticsearch::Utils
    UtilsPipeline_PUT:
      Description: ''
      Type: Elasticsearch::Utils
    Utils_DELETE:
      Description: ''
      Type: Elasticsearch::Utils
    Utils_GET:
      Description: ''
      Type: Elasticsearch::Utils
    Utils_PUT:
      Description: ''
      Type: Elasticsearch::Utils
  Transport:
    Config:
      DefaultCommand: POST
      Host: http://elastic:9200
      InvokerControllerMapping:
        CustomerCompanyManagement:
          Command: POST
          Controller: /customer/:docapi/:id
        CustomerUserManagement:
          Command: POST
          Controller: /customeruser/:docapi/:id
        Search:
          Command: POST
          Controller: /:index/_search
        TicketIngestAttachment:
          Command: POST
          Controller: /tmpattachments/:docapi/:id?pipeline=:path
        TicketManagement:
          Command: POST
          Controller: /ticket/:docapi/:id
        UtilsIngest_DELETE:
          Command: DELETE
          Controller: /:index/:docapi/:id
        UtilsIngest_GET:
          Command: GET
          Controller: /:index/:docapi/:id
        UtilsPipeline_DELETE:
          Command: DELETE
          Controller: /_ingest/pipeline/Attachments
        UtilsPipeline_PUT:
          Command: PUT
          Controller: /_ingest/pipeline/Attachments
        Utils_DELETE:
          Command: DELETE
          Controller: /:index
        Utils_GET:
          Command: GET
          Controller: /:index
        Utils_PUT:
          Command: PUT
          Controller: /:index
      Timeout: '30'
    Type: HTTP::REST
