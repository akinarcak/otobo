name: D724 ESM foundation

on:
  pull_request:
    paths:
      - 'development/d724/**'
      - 'packages/D724*/**'
      - 'Kernel/**'
      - 'bin/docker/**'
      - 'development/docker/**'
      - 'docs/esm/**'
      - 'careoncloud*.dockerfile'
      - 'cpanfile.docker.snapshot'
      - 'README.md'
      - 'NOTICE'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'COPYING-Third-Party'
      - '.github/workflows/d724-foundation.yml'
  push:
    branches:
      - 'codex/esm-*'
    paths:
      - 'development/d724/**'
      - 'packages/D724*/**'
      - 'Kernel/**'
      - 'bin/docker/**'
      - 'development/docker/**'
      - 'docs/esm/**'
      - 'careoncloud*.dockerfile'
      - 'cpanfile.docker.snapshot'
      - 'README.md'
      - 'NOTICE'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'COPYING-Third-Party'
      - '.github/workflows/d724-foundation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check whitespace
        run: git diff --check HEAD^

      - name: Validate foundation and Compose model
        shell: pwsh
        run: ./development/d724/Test-Foundation.ps1 -RequireDocker

      - name: Validate CareOnCloud source brand contract
        shell: pwsh
        run: ./development/d724/Test-CareOnCloudBrand.ps1

      - name: Validate critical customer and agent translations
        shell: pwsh
        run: ./development/d724/Test-CriticalLanguage.ps1

      - name: Generate and validate CPAN SBOM
        shell: pwsh
        run: |
          ./development/d724/Test-CpanSbom.ps1
          ./development/d724/Generate-CpanSbom.ps1

      - name: Upload CPAN SBOM
        uses: actions/upload-artifact@v4
        with:
          name: careoncloud-cpan-sbom
          path: artifacts/careoncloud-cpan-sbom.cdx.json
          if-no-files-found: error

      - name: Generate and validate source artifact
        shell: pwsh
        run: |
          ./development/d724/Test-SourceArtifact.ps1
          ./development/d724/Generate-SourceArtifact.ps1

      - name: Upload source artifact and manifest
        uses: actions/upload-artifact@v4
        with:
          name: careoncloud-source-artifact
          path: |
            artifacts/careoncloud-esm-source-*.zip
            artifacts/careoncloud-esm-source-*.manifest.json
          if-no-files-found: error

      - name: Scan repository dependencies for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-fs-results.json
          exit-code: '1'

      - name: Upload repository vulnerability scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: careoncloud-trivy-fs-results
          path: trivy-fs-results.json
          if-no-files-found: warn

      - name: Accept clean D724 package lifecycle
        shell: pwsh
        run: ./development/d724/Test-CleanPackageLifecycle.ps1
