name: CareOnCloud release image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Immutable image tag (for example candidate-<commit> or v1.0.0)'
        required: true
        type: string
  push:
    tags:
      - 'careoncloud-v*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/${{ github.repository }}/careoncloud
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Resolve immutable tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag='${{ inputs.image_tag }}'
          else
            tag="${GITHUB_REF_NAME#careoncloud-}"
          fi
          case "$tag" in
            ''|*[!A-Za-z0-9._-]*) echo 'Invalid image tag' >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx cache-capable builder
        uses: docker/setup-buildx-action@v4

      - name: Build and push CareOnCloud image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: careoncloud.web.dockerfile
          target: careoncloud-web
          pull: true
          # Deliberately no DOCKER_TAG build-arg. It is consumed by the expensive
          # `carton install` layer in careoncloud.web.dockerfile, so a per-release
          # value invalidates the CPAN cache on every build (measured: run
          # 30882609007 re-installed 213 distributions in 211.9s while every
          # preceding base layer was CACHED). The Dockerfile default `unspecified`
          # already selects the locked `carton install --deployment` path.
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=careoncloud-web
          cache-to: type=gha,mode=max,scope=careoncloud-web
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          format: cyclonedx-json
          output-file: careoncloud-${{ steps.tag.outputs.tag }}.cdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: careoncloud-sbom-${{ steps.tag.outputs.tag }}
          path: careoncloud-${{ steps.tag.outputs.tag }}.cdx.json
          if-no-files-found: error

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.0

      - name: Sign immutable image by keyless OIDC
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
