# --
# CareOnCloud ESM canonical reverse-proxy configuration.
#
# Keep the upstream CareOnCloud ESM sample include untouched. Enable this file only for
# a CareOnCloud candidate/release vhost after the alternate port has passed
# health, login, cookie and static-asset acceptance.
# --

Alias /careoncloud-web/ "/opt/careoncloud/var/httpd/htdocs/"

ProxyPass        "/careoncloud/" "http://127.0.0.1:5000/careoncloud/" retry=0 timeout=10
ProxyPassReverse "/careoncloud/" "http://127.0.0.1:5000/careoncloud/"

<Directory "/opt/careoncloud/var/httpd/htdocs/">
    AllowOverride None
    Require all granted
    AddCharset UTF-8 .css
    AddCharset UTF-8 .js
    AddType application/font-woff .woff
</Directory>

# Do not expose the legacy /careoncloud/ path from the CareOnCloud vhost. If a
# compatibility redirect is needed, configure it explicitly at the vhost
# boundary and verify that Location, cookies and generated links are canonical.
